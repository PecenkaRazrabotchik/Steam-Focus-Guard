name: Python validation

on:
  push:
    branches:
      - main
      - refactor/settings-ui
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Python files
        run: python -m compileall -q main.py steam_focus_guard.py src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate example configuration
        run: python -c "import json; json.load(open('config/config.example.json', encoding='utf-8'))"
